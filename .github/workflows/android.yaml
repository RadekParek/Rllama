name: android

# Builds the Android app in addition to the desktop artifacts produced by the
# existing release.yaml workflow: the native Ollama payload (Go binary plus the
# llama.cpp server) for arm64-v8a, then the installable APK.
#
# Triggered by:
#   * pushes to main / tags (v*) that touch anything the app depends on
#   * pull requests touching the app or the native build inputs
#   * manual runs (workflow_dispatch)
#
# When a matching GitHub release already exists for a tag, the APK is attached
# to it as an extra asset. That step never fails the workflow, so it cannot
# block the regular release pipeline.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - 'scripts/build_android.sh'
      - 'go.mod'
      - 'go.sum'
      - 'cmake/**'
      - 'llama/server/**'
      - 'llama/compat/**'
      - 'LLAMA_CPP_VERSION'
      - 'main.go'
      - 'cmd/**'
      - 'ml/**'
      - 'llm/**'
      - 'mlx/**'
      - 'mlxrunner/**'
      - 'server/**'
      - '.github/workflows/android.yaml'
  pull_request:
    # Pull requests only pay for the (slow) native build when they actually
    # touch the app. Full Go-level coverage still happens on main.
    paths:
      - 'android/**'
      - 'scripts/build_android.sh'
      - '.github/workflows/android.yaml'
      - 'LLAMA_CPP_VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-payload:
    name: native payload (android/arm64-v8a)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME#v}"
          version="$(echo "$raw" | sed -e 's/[^A-Za-z0-9._-]/-/g')"
          if [ -z "$version" ]; then
            version="0.0.0"
          fi
          if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            code="$(echo "$version" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')"
          else
            code="${{ github.run_number }}"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "version_code=$code" >>"$GITHUB_OUTPUT"
          echo "OLLAMA_VERSION=$version" >>"$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      - name: Locate the Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk=""
          for candidate in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}" "${ANDROID_NDK_LATEST_HOME:-}"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then ndk="$candidate"; break; fi
          done
          if [ -z "$ndk" ] && [ -d "$sdk/ndk" ]; then
            ndk="$sdk/ndk/$(ls -1 "$sdk/ndk" | sort -V | tail -1)"
          fi
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$sdkmanager" ] || sdkmanager="$sdk/tools/bin/sdkmanager"
            yes | "$sdkmanager" --install "ndk;27.0.12077973" >/dev/null
            ndk="$sdk/ndk/27.0.12077973"
          fi
          echo "Using NDK at $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >>"$GITHUB_ENV"
          echo "ndk=$ndk" >>"$GITHUB_OUTPUT"

      - name: Build native payload
        run: ./scripts/build_android.sh -a arm64-v8a

      - name: Verify payload
        shell: bash
        run: |
          set -euo pipefail
          for payload in \
            android/app/src/main/jniLibs/arm64-v8a/libollama.so \
            android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          do
            [ -f "$payload" ] || { echo "::error::missing $payload"; exit 1; }
            file "$payload"
            ls -l "$payload"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-native-payload
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 14

  apk:
    name: apk
    runs-on: ubuntu-latest
    needs: native-payload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK (platform 35 + build tools)
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/download-artifact@v4
        with:
          name: android-native-payload
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Prepare signing key (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            keystore="$RUNNER_TEMP/rllama-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$keystore"
            echo "ANDROID_KEYSTORE_FILE=$keystore" >>"$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >>"$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >>"$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >>"$GITHUB_ENV"
            echo "release builds will be signed"
          else
            echo "::notice::no ANDROID_KEYSTORE_BASE64 secret; release APK will be unsigned"
          fi

      - name: Build debug and release APKs
        working-directory: android
        env:
          OLLAMA_VERSION: ${{ needs.native-payload.outputs.version }}
          OLLAMA_VERSION_CODE: ${{ needs.native-payload.outputs.version_code }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.native-payload.outputs.version }}"
          mkdir -p dist
          shopt -s nullglob
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            cp "$apk" "dist/rllama-ollama-${version}-android-arm64-debug.apk"
          done
          for apk in android/app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *unsigned*) cp "$apk" "dist/rllama-ollama-${version}-android-arm64-release-unsigned.apk" ;;
              *) cp "$apk" "dist/rllama-ollama-${version}-android-arm64-release.apk" ;;
            esac
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  attach-to-release:
    name: attach APK to release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [native-payload, apk]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ollama-android-apk
          path: dist

      - name: Attach APK to the release for this tag
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          assets=(dist/*.apk)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::no APK artifacts to upload"
            exit 0
          fi

          # release.yaml publishes the release for this tag in parallel; wait a
          # little so the APK usually lands in the same release. Everything here
          # is best effort and never fails the workflow.
          for attempt in $(seq 1 20); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"; then
                echo "attached ${#assets[@]} APK(s) to $tag"
                exit 0
              fi
              echo "::warning::upload attempt $attempt failed; retrying"
            else
              echo "release for $tag not published yet (attempt $attempt)"
            fi
            sleep 30
          done
          echo "::notice::could not attach the APK to $tag; it stays available as the ollama-android-apk workflow artifact"
