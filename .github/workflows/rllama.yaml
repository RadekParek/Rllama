name: rllama

# Builds Rllama for all three targets from one codebase:
#   web      - typecheck, unit tests, production bundle
#   desktop  - Electron installers (AppImage on Linux, NSIS on Windows)
#   android  - Capacitor APK
on:
  push:
    branches:
      - main
    paths:
      - 'rllama/**'
      - '.github/workflows/rllama.yaml'
  pull_request:
    paths:
      - 'rllama/**'
      - '.github/workflows/rllama.yaml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rllama

jobs:
  web:
    name: typecheck, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rllama/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        shell: bash
        run: |
          set -euo pipefail
          total="$(du -sb dist | cut -f1)"
          js="$(find dist/assets -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
          echo "dist total: ${total} bytes; js: ${js} bytes"
          echo "::notice title=Rllama bundle::dist=${total} bytes js=${js} bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: rllama-web
          path: rllama/dist
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rllama-linux
          - os: windows-latest
            artifact: rllama-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rllama/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the renderer
        run: npm run build

      - name: Package the desktop app
        shell: bash
        env:
          # No code signing certificates in CI; unsigned builds are fine.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --publish never

      - name: Report artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -l release || true
          find release -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.deb' -o -name '*.zip' \) -printf '%s %p\n' | sort -rn | head -10

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rllama/release/*.AppImage
            rllama/release/*.exe
            rllama/release/*.deb
            rllama/release/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rllama/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the renderer and sync Capacitor
        run: |
          npm run build
          npx --no-install cap sync android

      - name: Build the APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify the APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$apk"
          echo "apk: $apk ($(stat -c%s "$apk") bytes)"
          unzip -l "$apk" | grep -E "assets/public/(index.html|icons/icon-192.png)" \
            || { echo "::error::the web bundle is missing from the APK"; exit 1; }
          unzip -l "$apk" | grep -E "res/.*/(ic_launcher|ic_launcher_foreground).*\.png" | head -5 \
            || { echo "::error::PNG launcher icons are missing from the APK"; exit 1; }
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          aapt2="$(ls -1 "$sdk"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$aapt2" ]; then
            "$aapt2" dump badging "$apk" | grep -E "^(package|launchable-activity)" || true
          fi
          echo "::notice title=Rllama APK::$(basename "$apk") $(stat -c%s "$apk") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: rllama-android-apk
          path: rllama/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
